      # OPTION 2: Deploy to Render (auto-deploys from GitHub, no action needed)

      # OPTION 3: Deploy to a VPS via SSH
      # - name: Deploy to VPS
      #   uses: appleboy/ssh-action@v1
      #   with:
      #     host: ${{ secrets.VPS_HOST }}
